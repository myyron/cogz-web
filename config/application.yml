spring:
    devtools:
        livereload:
            enabled: true
    thymeleaf:
        cache: false
    jpa:
        show-sql: false
        properties:
            hibernate:
                format_sql: false
        hibernate.ddl-auto: update
    h2:
        console:
            enabled: true
    sql:
        init:
            mode: always
            continue-on-error: true