cogz-web:
  app:
    version: '@project.version@'

server:
  servlet:
    session:
      timeout: 15m

spring:
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 3MB
      enabled: true
  devtools:
    livereload:
      enabled: true
  thymeleaf: # Thymeleaf
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
  resources: # Static resources
    static-locations: classpath:/static/
    cache:
      period: 0
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/cogz-web
    username: sa
    password:
  jpa:
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    hibernate.ddl-auto: update # for production use validate, otherwise update
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  sql:
    init:
      mode: always
      continue-on-error: true

logging:
  file:
    name: logs/cogz-web.log
  level:
    org:
      springframework:
        security: INFO