spring:
  thymeleaf: # Thymeleaf
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
  resources: # Static resources
    static-locations: classpath:/static/
    cache:
      period: 0
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/cogz-web2
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    hibernate.ddl-auto: update # for production use validate
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  file:
    name: logs/cogz-web2.log
  level:
    org:
      springframework:
        security: INFO