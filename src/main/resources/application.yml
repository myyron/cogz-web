cogz-web:
  app:
    version: '@project.version@'

spring:
  devtools:
    livereload:
        enabled: true
  thymeleaf: # Thymeleaf
    cache: false
    mode: HTML
    encoding: UTF-8
    prefix: classpath:/templates/
  resources: # Static resources
    static-locations: classpath:/static/
    cache:
      period: 0
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/cogz-web
    username: sa
    password:
  jpa:
    show-sql: true
    hibernate.ddl-auto: update # for production use validate
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
      continue-on-error: true

logging:
  file:
    name: logs/cogz-web.log
  level:
    org:
      springframework:
        security: INFO