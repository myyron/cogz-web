<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>CoGZ Online Portal</title>
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
              integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link href="https://cdn.datatables.net/2.2.2/css/dataTables.bootstrap5.css" rel="stylesheet">
        <link href="https://cdn.datatables.net/select/3.0.0/css/select.bootstrap5.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.css" rel="stylesheet">

        <link href="css/application.css" rel="stylesheet">

        <style>
            .bd-placeholder-img {
                font-size: 1.125rem;
                text-anchor: middle;
                -webkit-user-select: none;
                -moz-user-select: none;
                user-select: none;
            }

            @media (min-width: 768px) {
                .bd-placeholder-img-lg {
                    font-size: 3.5rem;
                }
            }

            .b-example-divider {
                width: 100%;
                height: 3rem;
                background-color: rgba(0, 0, 0, .1);
                border: solid rgba(0, 0, 0, .15);
                border-width: 1px 0;
                box-shadow: inset 0 .5em 1.5em rgba(0, 0, 0, .1), inset 0 .125em .5em rgba(0, 0, 0, .15);
            }

            .b-example-vr {
                flex-shrink: 0;
                width: 1.5rem;
                height: 100vh;
            }

            .bi {
                vertical-align: -.125em;
                fill: currentColor;
            }

            .nav-scroller {
                position: relative;
                z-index: 2;
                height: 2.75rem;
                overflow-y: hidden;
            }

            .nav-scroller .nav {
                display: flex;
                flex-wrap: nowrap;
                padding-bottom: 1rem;
                margin-top: -1px;
                overflow-x: auto;
                text-align: center;
                white-space: nowrap;
                -webkit-overflow-scrolling: touch;
            }

            .btn-bd-primary {
                --bd-violet-bg: #712cf9;
                --bd-violet-rgb: 112.520718, 44.062154, 249.437846;

                --bs-btn-font-weight: 600;
                --bs-btn-color: var(--bs-white);
                --bs-btn-bg: var(--bd-violet-bg);
                --bs-btn-border-color: var(--bd-violet-bg);
                --bs-btn-hover-color: var(--bs-white);
                --bs-btn-hover-bg: #6528e0;
                --bs-btn-hover-border-color: #6528e0;
                --bs-btn-focus-shadow-rgb: var(--bd-violet-rgb);
                --bs-btn-active-color: var(--bs-btn-hover-color);
                --bs-btn-active-bg: #5a23c8;
                --bs-btn-active-border-color: #5a23c8;
            }

            .bd-mode-toggle {
                z-index: 1500;
            }

            .bd-mode-toggle .dropdown-menu .active .bi {
                display: block !important;
            }
        </style>
    </head>
    <body>

        <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
    <symbol id="check2" viewBox="0 0 16 16">
        <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
    </symbol>
    <symbol id="circle-half" viewBox="0 0 16 16">
        <path d="M8 15A7 7 0 1 0 8 1v14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z"/>
    </symbol>
    <symbol id="moon-stars-fill" viewBox="0 0 16 16">
        <path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>
        <path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.734 1.734 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.734 1.734 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.734 1.734 0 0 0 1.097-1.097l.387-1.162zM13.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.156 1.156 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.156 1.156 0 0 0-.732-.732l-.774-.258a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732L13.863.1z"/>

    </symbol>
    </svg>

    <div class="dropdown position-fixed bottom-0 end-0 mb-3 me-3 bd-mode-toggle">
        <button class="btn btn-bd-primary py-2 dropdown-toggle d-flex align-items-center"
                id="bd-theme"
                type="button"
                aria-expanded="false"
                data-bs-toggle="dropdown"
                aria-label="Toggle theme (auto)">
            <svg class="bi my-1 theme-icon-active" width="1em" height="1em"><use href="#circle-half"></use></svg>
            <span class="visually-hidden" id="bd-theme-text">Toggle theme</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="bd-theme-text">
            <li>
                <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light" aria-pressed="false">
                    <svg class="bi me-2 opacity-50" width="1em" height="1em"><use href="#sun-fill"></use></svg>
                    Light
                    <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
                </button>
            </li>
            <li>
                <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark" aria-pressed="false">
                    <svg class="bi me-2 opacity-50" width="1em" height="1em"><use href="#moon-stars-fill"></use></svg>
                    Dark
                    <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
                </button>
            </li>
            <li>
                <button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="auto" aria-pressed="true">
                    <svg class="bi me-2 opacity-50" width="1em" height="1em"><use href="#circle-half"></use></svg>
                    Auto
                    <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
                </button>
            </li>
        </ul>
    </div>


    <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
    <symbol id="check" viewBox="0 0 16 16">
        <title>Check</title>
        <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
    </symbol>
    </svg>

    <header>
        <div th:replace="~{fragments/nav :: content}"></div>
    </header>

    <main>
        <div class="container">

            <!-- Game List Table -->
            <div class="row mb-3 justify-content-center">
                <div class="col-md-12 col-lg-10 col-xl-8 px-4">
                    <div class="card mb-2 rounded-3 shadow-sm">
                        <div class="card-header py-3 text-center">
                            <h5 class="my-0 h6">Game List</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col">
                                    <div class="btn-group" role="group">
                                        <th:block sec:authorize="hasAnyRole('ROLE_STAFF', 'ROLE_ADMIN')">
                                            <button type="button" id="showCreateGameModal" class="btn btn-outline-primary"
                                                    data-bs-toggle="modal" data-bs-target="#createGameModal">
                                                <i class="bi bi-plus-lg"></i>
                                            </button>
                                            <button type="button" id="showEditGameModal"
                                                    class="btn btn-outline-primary disabled" data-bs-toggle="modal"
                                                    data-bs-target="#editGameModal">
                                                <i class="bi bi-pen-fill"></i>
                                            </button>
                                        </th:block>
                                        <th:block sec:authorize="hasRole('ROLE_ADMIN')">
                                            <button type="button" id="deleteGameButton"
                                                    class="btn btn-outline-primary disabled">
                                                <i class="bi bi-trash-fill"></i>
                                            </button>
                                        </th:block>
                                    </div>

                                    <div class="btn-group" role="group">
                                        <button type="button" id="downloadButton" 
                                                class="btn btn-outline-primary disabled">
                                            <i class="bi bi-download"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div class="row justify-content-center">
                                <div class="col">
                                    <table id="gameListTable" class="table table-striped" style="width:100%">
                                        <thead>
                                            <tr>
                                                <th>Schedule</th>
                                                <th>Type</th>
                                                <th>#Players</th>
                                                <th>Status</th>
                                            </tr>
                                        </thead>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Registered User List Table -->
            <div class="row mb-3 justify-content-center">
                <div class="col-md-12 col-lg-10 col-xl-8 px-4">
                    <div class="card mb-2 rounded-3 shadow-sm">
                        <div class="card-header py-3 text-center">
                            <h5 class="my-0 h6">Registered User List</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col">
                                    <div class="btn-group" role="group">
                                        <th:block sec:authorize="hasAnyRole('ROLE_STAFF', 'ROLE_ADMIN')">
                                            <button type="button" id="showAddUsersModal"
                                                    class="btn btn-outline-primary disabled" data-bs-toggle="modal"
                                                    data-bs-target="#addUsersModal">
                                                <i class="bi bi-plus-lg"></i>
                                            </button>
                                            <button type="button" id="showEditUserModal"
                                                    class="btn btn-outline-primary disabled" data-bs-toggle="modal"
                                                    data-bs-target="#editUserModal">
                                                <i class="bi bi-pen-fill"></i>
                                            </button>
                                            <button type="button" id="removeUserButton"
                                                    class="btn btn-outline-primary disabled">
                                                <i class="bi bi-dash-lg"></i>
                                            </button>
                                        </th:block>
                                    </div>
                                </div>
                            </div>
                            <div class="row justify-content-center">
                                <div class="col">
                                    <table id="regUserListTable" class="table table-striped" style="width:100%">
                                        <thead>
                                            <tr>
                                                <th>Fullname</th>
                                                <th>Reg Status</th>
                                            </tr>
                                        </thead>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- editGameModal -->
        <div class="modal fade" id="editGameModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content rounded-4 shadow">
                    <form id="editGameForm">

                        <input type="hidden" id="editInputId" name="id"/>

                        <div class="modal-header">
                            <h1 class="modal-title h5">Edit Game</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            <div class="row mb-2">
                                <label for="editInputSchedule" class="col-sm-2 col-form-label text-small">Schedule</label>
                                <div class="col-sm-10">
                                    <input type="date" class="form-control form-control-sm" id="editInputSchedule"
                                           name="schedule" required>
                                </div>
                            </div>                                
                            <div class="row mb-2">
                                <label for="editInputAdvanceDeadline" class="col-sm-5 col-form-label text-small">Registration Cut-Off (hours)</label>
                                <div class="col-sm-7">
                                    <input type="number" min="0" step="1" class="form-control form-control-sm" id="editInputAdvanceDeadline"
                                           name="advanceDeadline" required>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <label for="editInputGameType" class="col-sm-2 col-form-label text-small">Type</label>
                                <div class="col-sm-10">
                                    <select id="editInputGameType" class="form-select form-select-sm" required>
                                        <option hidden selected></option>
                                        <option value="REGULAR">REGULAR</option>
                                        <option value="PRIVATE">PRIVATE</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-2">
                                <label for="editInputGameStatus" class="col-sm-2 col-form-label text-small">Status</label>
                                <div class="col-sm-10">
                                    <select id="editInputGameStatus" class="form-select form-select-sm" required>
                                        <option hidden selected></option>
                                        <option value="OPEN">OPEN - User visible, registration is enabled</option>
                                        <option value="LOCKED">LOCKED - User visible, registration is disabled</option>
                                        <option value="CLOSED">CLOSED - User hidden, payment images available</option>
                                        <th:block sec:authorize="hasRole('ROLE_ADMIN')">
                                            <option value="ARCHIVED">ARCHIVED - User hidden, payment images purged</option>
                                        </th:block>
                                    </select>
                                </div>
                            </div>                                                                
                            <div class="row mb-3">
                                <label for="editInputBanner" class="col-sm-4 form-label text-small">Banner</label>
                                <div class="col-sm-12">
                                    <input class="form-control form-control-sm" id="editInputBanner" type="file"
                                           accept="image/*" oninput="editBanner.src=window.URL.createObjectURL(this.files[0])">
                                </div>
                            </div>
                            <div class="row justify-content-center">
                                <div class="col-6">
                                    <img id="editBanner" alt="" class="img-thumbnail">
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button id="editGameButton" type="button" class="btn btn-outline-primary">
                                <span id="editGameSpinner" class="spinner-border spinner-border-sm"></span>
                                <span class="visually-hidden" role="status">Loading...</span>Save
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- addUsersModal -->
        <div class="modal fade" id="addUsersModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content rounded-4 shadow">
                    <form id="addUsersForm">

                        <div class="modal-header">
                            <h1 class="modal-title h5">Add Users to Selected Game</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            <div class="row mb-2">
                                <label for="inputAddUsers" class="col-sm-2 col-form-label text-small">Users</label>
                                <div class="col-sm-10">
                                    <select id="inputAddUsers" name="user[]" multiple placeholder="Select users..."
                                            autocomplete="off" required>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-outline-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- editUserModal -->
        <div class="modal fade" id="editUserModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content rounded-4 shadow">
                    <form id="editUserForm">

                        <input type="hidden" id="editInputGameUserId" name="id"/>
                        <input type="hidden" id="editInputUserId" name="userId"/>

                        <div class="modal-header">
                            <h1 class="modal-title h5">Edit Game User</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            <div class="row mb-3">
                                <label for="editInputRegStatus" class="col-sm-4 col-form-label text-small">Registration
                                    Status</label>
                                <div class="col-sm-8">
                                    <select id="editInputRegStatus" class="form-select form-select-sm" required>
                                        <option hidden selected></option>
                                        <option value="PAYMENT_VERIFICATION">PAYMENT_VERIFICATION</option>
                                        <option value="PAID">PAID</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="editInputPaymentProof" class="col-sm-4 form-label text-small">Proof of
                                    Payment</label>
                                <div class="col-sm-8">
                                    <input class="form-control form-control-sm" id="editInputPaymentProof" type="file"
                                           accept="image/*" oninput="paymentProof.src=window.URL.createObjectURL(this.files[0])">
                                </div>
                            </div>
                            <div class="row mb-3 justify-content-center">
                                <div class="col-6">
                                    <img id="paymentProof" alt="" class="img-thumbnail">
                                </div>
                            </div>
                            <div class="row mb-3">
                                <label for="editInputFps" class="col-sm-2 col-form-label text-small">FPS</label>
                                <div class="col-sm-10">
                                    <input type="text" class="form-control form-control-sm" id="editInputFps" name="fps">
                                </div>
                            </div>
                            <div class="row mb-2 form-check">
                                <div class="col-sm-2">
                                    <input class="form-check-input" type="checkbox" value="" id="editInputAbsent">
                                </div>
                                <label class="col-sm-4 form-check-label text-small" for="editInputAbsent">
                                    Absent
                                </label>
                            </div>
                            <div class="row mb-2 form-check">
                                <div class="col-sm-2">
                                    <input class="form-check-input" type="checkbox" value="" id="editInputRefunded">
                                </div>
                                <label class="col-sm-4 form-check-label text-small" for="editInputRefunded">
                                    Refunded
                                </label>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-outline-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/create-game-modal :: content}"></div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"

    crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
            integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
    crossorigin="anonymous"></script>
    <script src="https://cdn.datatables.net/2.2.2/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/2.2.2/js/dataTables.bootstrap5.js"></script>
    <script src="https://cdn.datatables.net/select/3.0.0/js/dataTables.select.js"></script>
    <script src="https://cdn.datatables.net/select/3.0.0/js/select.bootstrap5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootbox.js/6.0.0/bootbox.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>

    <script src="js/color-modes.js"></script>

    <script src="js/common-utils.js"></script>
    <script src="js/game-list.js"></script>
    <script>
        new GameList();
    </script>

</body>
</html>
