<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>CoGZ Online Portal</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link href="https://cdn.datatables.net/2.2.0/css/dataTables.bootstrap5.css" rel="stylesheet">
        <link href="https://cdn.datatables.net/2.2.0/css/dataTables.dataTables.css" rel="stylesheet">
        <link href="https://cdn.datatables.net/select/2.1.0/css/select.dataTables.css" rel="stylesheet">
        <link href="css/application.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <div th:replace="~{fragments/nav :: content}"></div>            
        </header>

        <main>
            <div class="container">

                <!-- User List Table -->
                <div class="row mb-3 justify-content-center">
                    <div class="col-md-12 col-lg-10 col-xl-8 px-4">
                        <div class="card mb-2 rounded-3 shadow-sm">
                            <div class="card-header py-3 text-center">
                                <h5 class="my-0 h6">User List</h5>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col">
                                        <div class="btn-group" role="group">
                                            <button type="button" id="showCreateUserModal" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#createUserModal">
                                                <i class="bi bi-plus-lg"></i>
                                            </button>
                                            <button type="button" id="showEditUserModal" class="btn btn-outline-primary disabled" data-bs-toggle="modal" data-bs-target="#editUserModal">
                                                <i class="bi bi-pen-fill"></i>
                                            </button>                                                
                                            <th:block sec:authorize="hasRole('ROLE_ADMIN')">
                                                <button type="button" id="deleteUserButton" class="btn btn-outline-primary disabled">
                                                    <i class="bi bi-trash-fill"></i>
                                                </button>
                                            </th:block>
                                        </div>
                                    </div>
                                </div>
                                <div class="row justify-content-center">
                                    <div class="col">
                                        <table id="userListTable" class="table table-striped" style="width:100%">
                                            <thead>
                                                <tr>
                                                    <th>Fullname</th>
                                                    <th>Role</th>
                                                    <th>Status</th>
                                                </tr>
                                            </thead>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- createUserModal -->
            <div class="modal fade" id="createUserModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content rounded-4 shadow">
                        <form id="createUserForm">
                            <div class="modal-header">
                                <h1 class="modal-title h5">Create User</h1>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>

                            <div class="modal-body">
                                <div class="row mb-2">
                                    <label for="inputUsername" class="col-sm-2 col-form-label text-small">Username</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control form-control-sm" id="inputUsername" name="username" disabled>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label for="inputFirstname" class="col-sm-2 col-form-label text-small">Firstname</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control form-control-sm" id="inputFirstname" name="firstname" required>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label for="inputLastname" class="col-sm-2 col-form-label text-small">Lastname</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control form-control-sm" id="inputLastname" name="lastname" required>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label for="inputEmail" class="col-sm-2 col-form-label text-small">Email</label>
                                    <div class="col-sm-10">
                                        <input type="email" class="form-control form-control-sm" id="inputEmail" name="email">
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label for="inputMobileNumber" class="col-sm-3 col-form-label text-small">Mobile Number</label>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control form-control-sm" id="inputMobileNumber" name="mobileNumber">
                                    </div>
                                </div>                
                                <div class="row mb-2">
                                    <label for="inputBirthdate" class="col-sm-2 col-form-label text-small">Birthdate</label>
                                    <div class="col-sm-10">
                                        <input type="date" class="form-control form-control-sm" id="inputBirthdate" name="birthdate">
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label for="inputRoleType" class="col-sm-3 col-form-label text-small">Role Type</label>
                                    <div class="col-sm-9">
                                        <select id="inputRoleType" class="form-select form-select-sm" required>
                                            <option hidden selected></option>
                                            <option value="USER">USER</option>
                                            <th:block sec:authorize="hasRole('ROLE_ADMIN')">
                                                <option value="STAFF">STAFF</option>
                                                <option value="ADMIN">ADMIN</option>
                                            </th:block>
                                        </select>
                                    </div>
                                </div>
                                <div class="row mb-4">
                                    <label for="inputUserStatus" class="col-sm-3 col-form-label text-small">Status</label>
                                    <div class="col-sm-9">
                                        <select id="inputUserStatus" class="form-select form-select-sm" required>
                                            <option hidden selected></option>
                                            <option value="ACCOUNT_VERIFICATION">ACCOUNT_VERIFICATION</option>
                                            <option value="GOOD">GOOD</option>
                                            <option value="BANNED">BANNED</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <div class="col">
                                        <div class="card">
                                            <div class="card-body">
                                                <div class="row">
                                                    <label for="inputPassword" class="col-12 col-form-label text-small">Password</label>
                                                    <div class="col-12">
                                                        <input type="password" class="form-control form-control-sm" id="inputPassword" name="password" required>
                                                    </div>
                                                </div>
                                                <div class="row">
                                                    <label for="inputPassword2" class="col-12 col-form-label text-small">Re-Enter Password</label>
                                                    <div class="col-12">
                                                        <input type="password" class="form-control form-control-sm" id="inputPassword2" name="password2" required>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn btn-outline-primary">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- editUserModal -->
            <div class="modal fade" id="editUserModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content rounded-4 shadow">
                        <form id="editUserForm">

                            <input type="hidden" id="editInputId" name="id"/>

                            <div class="modal-header">
                                <h1 class="modal-title h5">Edit User</h1>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>

                            <div class="modal-body">
                                <div class="row mb-2">
                                    <label for="editInputUsername" class="col-sm-2 col-form-label text-small">Username</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control form-control-sm" id="editInputUsername" name="username" disabled>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label for="editInputFirstname" class="col-sm-2 col-form-label text-small">Firstname</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control form-control-sm" id="editInputFirstname" name="firstname" required>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label for="editInputLastname" class="col-sm-2 col-form-label text-small">Lastname</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control form-control-sm" id="editInputLastname" name="lastname" required>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label for="editInputEmail" class="col-sm-2 col-form-label text-small">Email</label>
                                    <div class="col-sm-10">
                                        <input type="email" class="form-control form-control-sm" id="editInputEmail" name="email">
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label for="editInputMobileNumber" class="col-sm-3 col-form-label text-small">Mobile Number</label>
                                    <div class="col-sm-9">
                                        <input type="text" class="form-control form-control-sm" id="editInputMobileNumber" name="mobileNumber">
                                    </div>
                                </div>                
                                <div class="row mb-2">
                                    <label for="editInputBirthdate" class="col-sm-2 col-form-label text-small">Birthdate</label>
                                    <div class="col-sm-10">
                                        <input type="date" class="form-control form-control-sm" id="editInputBirthdate" name="birthdate">
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label for="editInputRoleType" class="col-sm-3 col-form-label text-small">Role Type</label>
                                    <div class="col-sm-9">
                                        <select id="editInputRoleType" class="form-select form-select-sm" required>
                                            <option hidden selected></option>
                                            <option value="USER">USER</option>
                                            <th:block sec:authorize="hasRole('ROLE_ADMIN')">
                                                <option value="STAFF">STAFF</option>
                                                <option value="ADMIN">ADMIN</option>
                                            </th:block>
                                        </select>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label for="editInputUserStatus" class="col-sm-3 col-form-label text-small">Status</label>
                                    <div class="col-sm-9">
                                        <select id="editInputUserStatus" class="form-select form-select-sm" required>
                                            <option hidden selected></option>
                                            <option value="ACCOUNT_VERIFICATION">ACCOUNT_VERIFICATION</option>
                                            <option value="GOOD">GOOD</option>
                                            <option value="BANNED">BANNED</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="button" id="showResetPasswordModal" class="btn btn-outline-primary" data-bs-dismiss="modal" data-bs-toggle="modal" data-bs-target="#resetPasswordModal">Reset Password</button>
                                <button type="submit" class="btn btn-outline-primary">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div th:replace="~{fragments/reset-pw-modal :: content}"></div>

        </main>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>   
        <script src="https://cdn.datatables.net/2.2.0/js/dataTables.js"></script>
        <script src="https://cdn.datatables.net/select/2.1.0/js/dataTables.select.js"></script>
        <script src="https://cdn.datatables.net/select/2.1.0/js/select.dataTables.js"></script>
        <script src="https://cdn.datatables.net/2.2.0/js/dataTables.bootstrap5.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootbox.js/6.0.0/bootbox.min.js"></script>

        <script src="js/common-utils.js"></script>
        <script src="js/user-list.js"></script>
        <script>
            new UserList();
        </script> 

    </body>
</html>
