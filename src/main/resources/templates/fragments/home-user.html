<!DOCTYPE html>

<html lang="en">
    <head>
    </head>
    <body>
        <div class="container" th:fragment="content">

            <div class="row mb-3 text-center">
                <div class="col px-4">
                    <div class="card mb-2 rounded-3 shadow-sm">
                        <div class="card-header py-3 text-center">
                            <h5 class="my-0 h6">My Profile</h5>
                        </div>
                        <div class="card-body">
                            <ul class="list-unstyled mb-4">
                                <li>amy</li>
                                <li>Amelia Latorilla</li>
                                <li>aalatorilla@gmail.com</li>
                                <li>09178685893</li>
                                <li>11/27/1979</li>
                            </ul>
                            <button type="button" class="w-100 btn btn-lg btn-outline-primary" data-bs-toggle="modal" data-bs-target="#modifyProfileModal">Request Modification</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mb-3 text-center">
                <div class="col px-4">
                    <div class="card mb-2 rounded-3 shadow-sm">
                        <div class="card-header py-3 text-center">
                            <h5 class="my-0 h6">Active Game Schedule</h5>
                        </div>
                        <div class="card-body">
                            Nothing to show
                        </div>
                    </div>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col px-4">
                    <div class="card mb-2 rounded-3 shadow-sm">
                        <div class="card-header py-3 text-center">
                            <h5 class="my-0 h6">My Tasks</h5>
                        </div>
                        <div class="card-body">
                            <div class="list-group list-group-flush mb-4">
                                <a href="#" class="list-group-item list-group-item-action" data-bs-toggle="modal" data-bs-target="#acceptGamesiteWaiver">
                                    Accept Gamesite Waiver
                                </a>
                                <a href="#" class="list-group-item list-group-item-action" data-bs-toggle="modal" data-bs-target="#takeRoeCourse">Take ROE Course</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- modifyProfileModal -->
            <div class="modal fade" id="modifyProfileModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <form>
                            <div class="modal-header">
                                <h1 class="modal-title fs-5" id="staticBackdropLabel">Modify Profile</h1>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <div class="row mb-3">
                                    <label for="inputUsername" class="col-sm-2 col-form-label">Username</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" id="inputUsername">
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label for="inputFirstname" class="col-sm-2 col-form-label">Firstname</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" id="inputFirstname">
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label for="inputLastname" class="col-sm-2 col-form-label">Lastname</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" id="inputLastname">
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label for="inputEmail" class="col-sm-2 col-form-label">Email</label>
                                    <div class="col-sm-10">
                                        <input type="email" class="form-control" id="inputEmail">
                                    </div>
                                </div>
                                <div class="row mb-3">
                                    <label for="inputMobileNumber" class="col-sm-2 col-form-label">Mobile Number</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" id="inputMobileNumber">
                                    </div>
                                </div>                
                                <div class="row mb-3">
                                    <label for="inputBirthdate" class="col-sm-2 col-form-label">Birthdate</label>
                                    <div class="col-sm-10">
                                        <input type="text" class="form-control" id="inputBirthdate">
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="submit" class="btn btn-primary">Send</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </body>
</html>
