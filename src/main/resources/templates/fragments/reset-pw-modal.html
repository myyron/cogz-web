<!DOCTYPE html>

<html lang="en">
    <head>
    </head>
    <body>
        <div th:fragment="content">

            <!-- resetPasswordModal -->
            <div class="modal fade" id="resetPasswordModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content rounded-4 shadow">
                        <form id="resetPasswordForm">

                            <input type="hidden" id="resetPasswordUserId" name="id"/>

                            <div class="modal-header">
                                <h1 class="modal-title h5">Reset Password</h1>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>

                            <div class="modal-body">
                                <div class="row mb-2">
                                    <label for="resetInputPassword" class="col-12 col-form-label text-small">New Password</label>
                                    <div class="col-12">
                                        <input type="password" class="form-control form-control-sm" id="resetInputPassword" name="password1" required>
                                    </div>
                                </div>
                                <div class="row mb-2">
                                    <label for="resetInputPassword2" class="col-12 col-form-label text-small">Re-Enter New Password</label>
                                    <div class="col-12">
                                        <input type="password" class="form-control form-control-sm" id="resetInputPassword2" name="password2" required>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                                <button type="submit" id="resetPasswordButton" class="btn btn-outline-primary">Save</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </div>
    </body>
</html>
