<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>CoGZ Online Portal</title>
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/css/tom-select.css" rel="stylesheet">
        <link href="css/application.css" rel="stylesheet">
    </head>
    <body>
        <header>
            <div th:replace="~{fragments/nav :: content}"></div>            
        </header>

        <main>            
            <div sec:authorize="hasRole('ROLE_USER')">
                <div th:replace="~{fragments/home-user :: content}"></div>
            </div>
            <div sec:authorize="hasAnyRole('ROLE_PSEUDO_STAFF', 'ROLE_STAFF', 'ROLE_ADMIN')">
                <div th:replace="~{fragments/home-admin :: content}"></div>
            </div>
        </main>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>   
        <script src="https://cdnjs.cloudflare.com/ajax/libs/bootbox.js/6.0.0/bootbox.min.js"></script>
        <script src="js/common-utils.js"></script>

    <th:block sec:authorize="hasRole('ROLE_USER')">

        <link href="css/flipdown.css" rel="stylesheet">

        <script src="https://cdn.jsdelivr.net/npm/clipboard@2.0.11/dist/clipboard.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.3/dist/js/tom-select.complete.min.js"></script>
        <script src="js/flipdown.js"></script>
        <script src="js/home-user.js"></script>

        <script>
            new HomeUser();
        </script> 
    </th:block>

    <th:block sec:authorize="hasAnyRole('ROLE_PSEUDO_STAFF', 'ROLE_STAFF', 'ROLE_ADMIN')">

        <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
        <script src="js/home-admin.js"></script>

        <script>
            new HomeAdmin();
        </script>
    </th:block>

</body>
</html>
