<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>CoGZ Online Portal</title>
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

        <link href="css/application.css" rel="stylesheet">
    </head>

    <body>

        <div th:replace="~{fragments/theme :: content}"></div>

        <header>
            <div th:replace="~{fragments/nav :: content}"></div>            
        </header>

        <main>
            <div class="container">

                <!-- Joule Creep Calculator -->
                <div class="row mb-3 justify-content-center">
                    <div class="col-md-12 col-lg-10 col-xl-8 px-4">
                        <div class="card mb-2 rounded-3 shadow-sm">
                            <div class="card-header py-3 text-center">
                                <h5 class="my-0 h6">Joule Creep Calculator</h5>
                            </div>
                            <div class="card-body">

                                <div class="row mb-3">
                                    <label for="airsoftType" class="col-12 col-form-label text-small">Airsoft Type</label>
                                    <div class="col-12 col-md-6">
                                        <select id="airsoftType" class="form-select form-select-sm">
                                            <option hidden selected></option>
                                            <option value="1">AEG, GBBR, HPA / AEP, GBBP</option>
                                            <option value="2">BASR (Springer, GBBR, HPA)</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col">
                                        <span class="text-xs fw-bold">Standard BB</span>
                                        <div class="row">
                                            <div class="col">
                                                <label class="col col-form-label text-small">BB Weight</label>
                                                <div class="col mb-3">
                                                    <input type="number" class="form-control form-control-sm" id="baselineBbWeight" disabled>
                                                </div>
                                            </div>
                                            <div class="col">
                                                <label class="col col-form-label text-small">FPS</label>
                                                <div class="col mb-3">
                                                    <input type="number" class="form-control form-control-sm" id="baselineFps" disabled>
                                                </div>
                                            </div>
                                            <div class="col">
                                                <label class="col col-form-label text-small">Joule</label>
                                                <div class="col mb-3">
                                                    <input type="number" class="form-control form-control-sm" id="baselineJoule" disabled>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row mb-4">
                                    <div class="col">
                                        <span class="text-xs fw-bold">Player BB</span>
                                        <div class="row">
                                            <div class="col">
                                                <label class="col col-form-label text-small">BB Weight</label>
                                                <div class="col">
                                                    <input type="number" class="form-control form-control-sm" id="endlineBbWeight" disabled>
                                                </div>
                                            </div>
                                            <div class="col">
                                                <label class="col col-form-label text-small">FPS</label>
                                                <div class="col">
                                                    <input type="number" class="form-control form-control-sm" id="endlineFps" disabled>
                                                </div>
                                            </div>
                                            <div class="col">
                                                <label class="col col-form-label text-small">Joule</label>
                                                <div class="col">
                                                    <input type="number" class="form-control form-control-sm" id="endlineJoule" disabled>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="row justify-content-center">
                                    <div class="col">                                        
                                        <div class="card">
                                            <div class="card-body">                                                    
                                                <span class="text-xs fw-bold">Joule Creep</span>
                                                <div class="row mt-1">
                                                    <div class="col-auto">
                                                        <ul class="list-unstyled px-2">
                                                            <li class="text-small">Difference: <span id="difference" class="fw-bold fs-4"></span></li>
                                                            <li class="text-small">Increase %: <span id="increase" class="fw-bold fs-4"></span></li>
                                                            <li class="text-small">Your new FPS: <span id="newFps" class="fw-bold fs-4"></span></li>
                                                        </ul>
                                                    </div>                                                        
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>   

        <script src="js/color-modes.js"></script>

        <script src="js/tools.js"></script>
        <script>
            new Tools();
        </script> 

    </body>
</html>
