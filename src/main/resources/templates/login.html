<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Online portal for airsoft game registration managed by Contractors of Ground Zero (CoGZ). Gamesite located at SLLBP-MJC (formerly race horse compound consisting of abandoned barracks and stables), Carmona Cavite, Philippines.">
        <title>CoGZ Online Portal</title>
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

        <link href="css/application.css" rel="stylesheet">

        <style>
            body{
                height: 100dvh;
            }
            .container{
                height: 100%;
            }

            .bd-placeholder-img {
                font-size: 1.125rem;
                text-anchor: middle;
                -webkit-user-select: none;
                -moz-user-select: none;
                user-select: none;
            }

            @media (min-width: 768px) {
                .bd-placeholder-img-lg {
                    font-size: 3.5rem;
                }
            }

            .b-example-divider {
                width: 100%;
                height: 3rem;
                background-color: rgba(0, 0, 0, .1);
                border: solid rgba(0, 0, 0, .15);
                border-width: 1px 0;
                box-shadow: inset 0 .5em 1.5em rgba(0, 0, 0, .1), inset 0 .125em .5em rgba(0, 0, 0, .15);
            }

            .b-example-vr {
                flex-shrink: 0;
                width: 1.5rem;
                height: 100vh;
            }

            .bi {
                vertical-align: -.125em;
                fill: currentColor;
            }

            .nav-scroller {
                position: relative;
                z-index: 2;
                height: 2.75rem;
                overflow-y: hidden;
            }

            .nav-scroller .nav {
                display: flex;
                flex-wrap: nowrap;
                padding-bottom: 1rem;
                margin-top: -1px;
                overflow-x: auto;
                text-align: center;
                white-space: nowrap;
                -webkit-overflow-scrolling: touch;
            }

            .btn-bd-primary {
                --bd-violet-bg: #712cf9;
                --bd-violet-rgb: 112.520718, 44.062154, 249.437846;

                --bs-btn-font-weight: 600;
                --bs-btn-color: var(--bs-white);
                --bs-btn-bg: var(--bd-violet-bg);
                --bs-btn-border-color: var(--bd-violet-bg);
                --bs-btn-hover-color: var(--bs-white);
                --bs-btn-hover-bg: #6528e0;
                --bs-btn-hover-border-color: #6528e0;
                --bs-btn-focus-shadow-rgb: var(--bd-violet-rgb);
                --bs-btn-active-color: var(--bs-btn-hover-color);
                --bs-btn-active-bg: #5a23c8;
                --bs-btn-active-border-color: #5a23c8;
            }

            .bd-mode-toggle {
                z-index: 1500;
            }

            .bd-mode-toggle .dropdown-menu .active .bi {
                display: block !important;
            }
        </style>
    </head>
    <body>

        <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
    <symbol id="check2" viewBox="0 0 16 16">
        <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
    </symbol>
    <symbol id="circle-half" viewBox="0 0 16 16">
        <path d="M8 15A7 7 0 1 0 8 1v14zm0 1A8 8 0 1 1 8 0a8 8 0 0 1 0 16z"/>
    </symbol>
    <symbol id="moon-stars-fill" viewBox="0 0 16 16">
        <path d="M6 .278a.768.768 0 0 1 .08.858 7.208 7.208 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277.527 0 1.04-.055 1.533-.16a.787.787 0 0 1 .81.316.733.733 0 0 1-.031.893A8.349 8.349 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.752.752 0 0 1 6 .278z"/>
        <path d="M10.794 3.148a.217.217 0 0 1 .412 0l.387 1.162c.173.518.579.924 1.097 1.097l1.162.387a.217.217 0 0 1 0 .412l-1.162.387a1.734 1.734 0 0 0-1.097 1.097l-.387 1.162a.217.217 0 0 1-.412 0l-.387-1.162A1.734 1.734 0 0 0 9.31 6.593l-1.162-.387a.217.217 0 0 1 0-.412l1.162-.387a1.734 1.734 0 0 0 1.097-1.097l.387-1.162zM13.863.099a.145.145 0 0 1 .274 0l.258.774c.115.346.386.617.732.732l.774.258a.145.145 0 0 1 0 .274l-.774.258a1.156 1.156 0 0 0-.732.732l-.258.774a.145.145 0 0 1-.274 0l-.258-.774a1.156 1.156 0 0 0-.732-.732l-.774-.258a.145.145 0 0 1 0-.274l.774-.258c.346-.115.617-.386.732-.732L13.863.1z"/>
    </symbol>
    <symbol id="sun-fill" viewBox="0 0 16 16">
        <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0zm0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13zm8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5zM3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8zm10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0zm-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0zm9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707zM4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708z"/>
    </symbol>
    </svg>

    <div class="dropdown position-fixed bottom-0 end-0 mb-3 me-3 bd-mode-toggle">
        <button class="btn btn-bd-primary py-2 dropdown-toggle d-flex align-items-center"
                id="bd-theme"
                type="button"
                aria-expanded="false"
                data-bs-toggle="dropdown"
                aria-label="Toggle theme (auto)">
            <svg class="bi my-1 theme-icon-active" width="1em" height="1em"><use href="#circle-half"></use></svg>
            <span class="visually-hidden" id="bd-theme-text">Toggle theme</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="bd-theme-text">
            <li>
                <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light" aria-pressed="false">
                    <svg class="bi me-2 opacity-50" width="1em" height="1em"><use href="#sun-fill"></use></svg>
                    Light
                    <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
                </button>
            </li>
            <li>
                <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="dark" aria-pressed="false">
                    <svg class="bi me-2 opacity-50" width="1em" height="1em"><use href="#moon-stars-fill"></use></svg>
                    Dark
                    <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
                </button>
            </li>
            <li>
                <button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="auto" aria-pressed="true">
                    <svg class="bi me-2 opacity-50" width="1em" height="1em"><use href="#circle-half"></use></svg>
                    Auto
                    <svg class="bi ms-auto d-none" width="1em" height="1em"><use href="#check2"></use></svg>
                </button>
            </li>
        </ul>
    </div>


    <svg xmlns="http://www.w3.org/2000/svg" class="d-none">
    <symbol id="check" viewBox="0 0 16 16">
        <title>Check</title>
        <path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/>
    </symbol>
    </svg>

    <div class="container d-flex align-items-center justify-content-center">
        <div class="row justify-content-center">
            <div class="col-9 col-md-6 col-lg-4 mb-3">                               
                <span style="font-size: .6rem;">v<th:block th:text="${@environment.getProperty('cogz-web.app.version')}"></th:block></span>
                <img src="images/logo-login.png" class="img-fluid"/>
            </div>
            <div class="col-9 col-md-6 col-lg-3 mt-md-5">
                <form th:action="@{/login}" method="post" class="form-signin">                
                    <div class="row mb-1 justify-content-center">
                        <div class="col form-floating">
                            <input type="text" id="loginUsername" name="username" class="form-control">
                            <label for="loginUsername">Username</label>
                        </div>
                    </div>
                    <div class="row mb-3 justify-content-center">
                        <div class="col form-floating">
                            <input type="password" id="loginPassword" name="password" class="form-control">
                            <label for="loginPassword">Password</label>
                        </div>
                    </div>
                    <div class="row justify-content-center">
                        <div class="col">
                            <ul class="list-unstyled">
                                <li><button type="submit" class="btn btn-primary w-100 py-2">Login</button></li>
                                <li class="text-center">or</li>
                                <li><button type="button" id="showSignupModal" class="btn btn-secondary w-100 py-2"
                                            data-bs-toggle="modal"
                                            data-bs-target="#signupModal">Signup
                                    </button></li>
                                <li class="text-center mt-2">
                                    <div th:if="${param.error}" class="text-danger">
                                        Invalid username and password.
                                    </div>
                                    <div th:if="${param.logout}">
                                        You have been logged out.
                                    </div>
                                </li>
                                <li class="text-body-secondary text-center mt-3" style="font-size: smaller">&copy; 2025 Contractors of Ground Zero (CoGZ)</li>
                            </ul>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- signupModal -->
    <div class="modal fade" id="signupModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content rounded-4 shadow">
                <form id="signupForm">
                    <div class="modal-header">
                        <h1 class="modal-title h5">Signup and Create Your Account</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <div class="modal-body">
                        <div class="row mb-2">
                            <label for="inputUsername" class="col-sm-2 col-form-label text-small">Username</label>
                            <div class="col-sm-10">
                                <input type="text" class="form-control form-control-sm" id="inputUsername" name="username" disabled>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <label for="inputFirstname" class="col-sm-2 col-form-label text-small">Firstname</label>
                            <div class="col-sm-10">
                                <input type="text" class="form-control form-control-sm" id="inputFirstname" name="firstname" required>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <label for="inputLastname" class="col-sm-2 col-form-label text-small">Lastname</label>
                            <div class="col-sm-10">
                                <input type="text" class="form-control form-control-sm" id="inputLastname" name="lastname" required>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <label for="inputCallsign" class="col-sm-2 col-form-label text-small">Callsign</label>
                            <div class="col-sm-10">
                                <input type="text" class="form-control form-control-sm" id="inputCallsign" name="callsign">
                            </div>
                        </div>
                        <div class="row mb-2">
                            <label for="inputEmail" class="col-sm-2 col-form-label text-small">Email</label>
                            <div class="col-sm-10">
                                <input type="email" class="form-control form-control-sm" id="inputEmail" name="email" required>
                            </div>
                        </div>
                        <div class="row mb-2">
                            <label for="inputMobileNumber" class="col-sm-4 col-form-label text-small">Mobile Number</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control form-control-sm" id="inputMobileNumber" name="mobileNumber" required>
                            </div>
                        </div>                
                        <div class="row mb-3">
                            <label for="inputBirthdate" class="col-sm-2 col-form-label text-small">Birthdate</label>
                            <div class="col-sm-10">
                                <input type="date" class="form-control form-control-sm" id="inputBirthdate" name="birthdate" required>
                            </div>
                        </div>                            
                        <div class="row mb-3">
                            <div class="col">
                                <div class="card">
                                    <div class="card-body">
                                        <div class="row">
                                            <label for="signupPassword" class="col-12 col-form-label text-small">Password</label>
                                            <div class="col-12">
                                                <input type="password" class="form-control form-control-sm" id="signupPassword" name="password1" required>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <label for="signupPassword2" class="col-12 col-form-label text-small">Re-Enter Password</label>
                                            <div class="col-12">
                                                <input type="password" class="form-control form-control-sm" id="signupPassword2" name="password2" required>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>                                   
                        <div class="row mb-2">
                            <div class="col">
                                <div class="card">
                                    <div class="card-body">               
                                        <div class="row mb-3">
                                            <label for="inputValidId" class="col-sm-4 form-label text-small">Valid ID</label>
                                            <div class="col-sm-12">
                                                <input class="form-control form-control-sm" id="inputValidId" type="file"
                                                       accept="image/*" oninput="validId.src=window.URL.createObjectURL(this.files[0])" required>
                                            </div>
                                        </div>
                                        <div class="row justify-content-center">
                                            <div class="col-auto">
                                                <img id="validId" src="images/blank-id.png" alt="" class="img-thumbnail">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="button" id="signupButton" class="btn btn-outline-primary">
                            <span id="spinner" class="spinner-border spinner-border-sm"></span>
                            <span class="visually-hidden" role="status">Loading...</span>Signup
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootbox.js/6.0.0/bootbox.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

    <script src="js/color-modes.js"></script>

    <script src="js/common-utils.js"></script>        
    <script src="js/stomp.js"></script>
    <script src="js/login.js"></script>

    <script>
        new Login();
    </script>

</body>
</html>
